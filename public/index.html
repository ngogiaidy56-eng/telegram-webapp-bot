<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; color: #ffffff; padding: 12px;
        }
        .view { display: none; }
        .active-view { display: flex; flex-direction: column; gap: 8px; }
        .menu-container { max-width: 500px; margin: 0 auto; }
        .btn-row { display: flex; gap: 8px; width: 100%; }
        .btn {
            flex: 1; padding: 14px 12px; border: none; border-radius: 8px;
            color: white; font-weight: bold; font-size: 13px; text-align: center;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-orange { background-color: #d97706; }
        .btn-green { background-color: #16a34a; }
        .btn-teal { background-color: #0284c7; }
        .btn-red { background-color: #dc2626; }
        .btn-full { width: 100%; }
        .card { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 8px; }
        .tx-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 12px; }
    </style>
</head>
<body>
    <div class="menu-container">
        
        <!-- MENU CHÍNH -->
        <div id="main-menu" class="view active-view">
            <div class="btn-row">
                <button class="btn btn-orange" onclick="sendAction('minigame', '🚀 MINIGAME LIVE')">🚀 MINIGAME LIVE</button>
                <button class="btn btn-teal" onclick="sendAction('thue_tool', '🤖 THUÊ TOOL (NEW)')">🤖 THUÊ TOOL (NEW)</button>
            </div>
            <button class="btn btn-green btn-full" onclick="sendAction('mua_lixi', '🎁 MƯA LÌ XÌ')">🎁 MƯA LÌ XÌ - CODE MÀN - CODE TELE</button>
            <div class="btn-row">
                <button class="btn btn-orange" onclick="showView('deposit-menu')">💳 NẠP TIỀN</button>
                <button class="btn btn-teal" onclick="sendAction('otp_proxy', '🎁 OTP & PROXY')">🎁 OTP & PROXY</button>
            </div>
            <button class="btn btn-teal btn-full" onclick="sendAction('kho_cong_cu', '📇 KHO CÔNG CỤ')">📇 KHO CÔNG CỤ ĐẶC QUYỀN</button>
            <button class="btn btn-teal btn-full" onclick="loadCustomerCenter()">💎 TRUNG TÂM KHÁCH HÀNG</button>
            <button class="btn btn-orange btn-full" onclick="sendAction('ghep_doi_dau', '⚔️ HỆ THỐNG GHÉP ĐỐI ĐẦU')">⚔️ HỆ THỐNG GHÉP ĐỐI ĐẦU</button>
            <div class="btn-row">
                <button class="btn btn-teal" onclick="sendAction('gioi_thieu_ref', '👥 Giới thiệu REF')">👥 Giới thiệu REF</button>
                <button class="btn btn-green" onclick="sendAction('trung_tam_vip', '👑 TRUNG TÂM VIP')">👑 TRUNG TÂM VIP</button>
            </div>
        </div>

        <!-- MỐC NẠP TIỀN -->
        <div id="deposit-menu" class="view">
            <h3 style="margin-bottom: 8px;">💳 Chọn Mốc Nạp Tiền</h3>
            <button class="btn btn-green btn-full" onclick="selectDeposit(50000)">💵 Nạp 50,000 VNĐ</button>
            <button class="btn btn-green btn-full" onclick="selectDeposit(100000)">💵 Nạp 100,000 VNĐ</button>
            <button class="btn btn-green btn-full" onclick="selectDeposit(500000)">💵 Nạp 500,000 VNĐ</button>
            <button class="btn btn-red btn-full" onclick="showView('main-menu')" style="margin-top: 10px;">⬅️ Quay lại Menu</button>
        </div>

        <!-- TRUNG TÂM KHÁCH HÀNG & WEBSOCKET -->
        <div id="customer-center" class="view">
            <h3 style="margin-bottom: 8px;">💎 Trung Tâm Khách Hàng</h3>
            <div class="card">
                <p>Số dư hiện tại (Real-time):</p>
                <h2 id="user-balance" style="color: #4ade80; margin-top: 4px;">0 VNĐ</h2>
            </div>
            <div class="card">
                <p style="margin-bottom: 6px; font-weight: bold;">📜 Lịch sử nạp tiền gần đây:</p>
                <div id="tx-history-list">
                    <p style="font-size: 12px; color: #94a3b8;">Đang kết nối WebSocket...</p>
                </div>
            </div>
            <button class="btn btn-red btn-full" onclick="showView('main-menu')">⬅️ Quay lại Menu</button>
        </div>

    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 123456;
        const WORKER_HOST = "https://1b8fc54e.telegram-webapp-bot-7ym.pages.dev"; // Thay bằng Worker domain của bạn

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        function sendAction(actionKey, actionName) {
            tg.sendData(JSON.stringify({ action: actionKey, name: actionName }));
        }

        function selectDeposit(amount) {
            tg.sendData(JSON.stringify({ action: "select_deposit", amount: amount }));
        }

        // Khởi tạo kết nối WebSocket khi vào Trung tâm khách hàng
        function loadCustomerCenter() {
            showView('customer-center');
            
            // 1. Lấy lịch sử giao dịch qua REST API trước
            fetch(`https://${WORKER_HOST}/api/user-history?user_id=${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('user-balance').innerText = data.balance.toLocaleString() + " VNĐ";
                    let historyContainer = document.getElementById('tx-history-list');
                    historyContainer.innerHTML = "";
                    if (data.history.length === 0) {
                        historyContainer.innerHTML = `<p style="font-size: 12px; color: #94a3b8;">Chưa có giao dịch nào.</p>`;
                    } else {
                        data.history.forEach(tx => {
                            historyContainer.innerHTML += `
                                <div class="tx-item">
                                    <div>
                                        <span style="color: #4ade80; font-weight: bold;">+${tx.amount.toLocaleString()}đ</span><br>
                                        <small style="color: #94a3b8;">Mã: ${tx.code}</small>
                                    </div>
                                    <div style="text-align: right;"><small style="color: #94a3b8;">${tx.time}</small></div>
                                </div>
                            `;
                        });
                    }
                });

            // 2. Mở kết nối WebSocket lắng nghe biến động số dư thời gian thực
            const ws = new WebSocket(`wss://${WORKER_HOST}/ws`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: "register", user_id: userId }));
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "balance_update") {
                    document.getElementById('user-balance').innerText = msg.balance.toLocaleString() + " VNĐ";
                }
            };
        }
    </script>
</body>
</html>
