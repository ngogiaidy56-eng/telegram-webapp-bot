<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }
        .btn-row { display: flex; gap: 8px; width: 100%; }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-orange { background-color: #d97706; }
        .btn-green { background-color: #16a34a; }
        .btn-teal { background-color: #0284c7; }
        .btn-full { width: 100%; }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="btn-row">
            <button class="btn btn-orange" onclick="sendAction('minigame', '🚀 MINIGAME LIVE')">🚀 MINIGAME LIVE</button>
            <button class="btn btn-teal" onclick="sendAction('thue_tool', '🤖 THUÊ TOOL (NEW)')">🤖 THUÊ TOOL (NEW)</button>
        </div>
        <button class="btn btn-green btn-full" onclick="sendAction('mua_lixi', '🎁 MƯA LÌ XÌ - CODE MÀN - CODE TELE')">🎁 MƯA LÌ XÌ - CODE MÀN - CODE TELE</button>
        <div class="btn-row">
            <button class="btn btn-orange" onclick="sendAction('nap_tien', '💳 NẠP TIỀN')">💳 NẠP TIỀN</button>
            <button class="btn btn-teal" onclick="sendAction('otp_proxy', '🎁 OTP & PROXY')">🎁 OTP & PROXY</button>
        </div>
        <button class="btn btn-teal btn-full" onclick="sendAction('kho_cong_cu', '📇 KHO CÔNG CỤ ĐẶC QUYỀN')">📇 KHO CÔNG CỤ ĐẶC QUYỀN</button>
        <button class="btn btn-teal btn-full" onclick="sendAction('trung_tam_kh', '💎 TRUNG TÂM KHÁCH HÀNG')">💎 TRUNG TÂM KHÁCH HÀNG</button>
        <button class="btn btn-orange btn-full" onclick="sendAction('ghep_doi_dau', '⚔️ HỆ THỐNG GHÉP ĐỐI ĐẦU')">⚔️ HỆ THỐNG GHÉP ĐỐI ĐẦU</button>
        <div class="btn-row">
            <button class="btn btn-teal" onclick="sendAction('gioi_thieu_ref', '👥 Giới thiệu REF')">👥 Giới thiệu REF</button>
            <button class="btn btn-green" onclick="sendAction('trung_tam_vip', '👑 TRUNG TÂM VIP')">👑 TRUNG TÂM VIP</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-green" onclick="openLink('https://t.me/nhomchat_cuaban')">💬 NHÓM CHAT ↗</button>
            <button class="btn btn-green" onclick="openLink('https://t.me/kenhthongbao_cuaban')">📢 KÊNH THÔNG BÁO ↗</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-green" onclick="sendAction('nhap_gifcode', '🎁 NHẬP GIFCODE')">🎁 NHẬP GIFCODE</button>
            <button class="btn btn-green" onclick="sendAction('lien_he_cskh', '🐶 LIÊN HỆ CSKH')">🐶 LIÊN HỆ CSKH</button>
        </div>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function sendAction(actionKey, actionName) {
            tg.sendData(JSON.stringify({ action: actionKey, name: actionName }));
        }
        function openLink(url) {
            tg.openTelegramLink(url);
        }
    </script>
</body>
